potential_field_node:
  ros__parameters:
    # Goal position (can be overridden by /goal_pose topic)
    goal_x: 4.0
    goal_y: 2.0

    # Force gains
    k_attractive: 2.1
    k_repulsive: 1.25 #0.3

    # Ranges
    repulsive_range: 0.58 # Obstacle influence range (m)
    obstacle_threshold: 0.45 # Start slowing down distance (m)
    goal_tolerance: 0.01 # Goal reached distance (m)

    # Velocity limits
    max_linear_speed: 0.2 # TurtleBot3 max
    min_linear_speed: 0.001
    max_angular_speed: 0.4 # TurtleBot3 max 2.0
