potential_field_node:
  ros__parameters:
    # Goal position (can be overridden by /goal_pose topic)
    goal_x: 4.0
    goal_y: 2.0

    # Force gains
    k_attractive: 2.0
    k_repulsive: 1.4 #0.3

    # Ranges
    repulsive_range: 0.65 # Obstacle influence range (m)
    obstacle_threshold: 0.3 # Start slowing down distance (m)
    goal_tolerance: 0.01 # Goal reached distance (m)

    # Velocity limits
    max_linear_speed: 0.22 # TurtleBot3 max
    min_linear_speed: 0.05
    max_angular_speed: 3.0 # TurtleBot3 max
