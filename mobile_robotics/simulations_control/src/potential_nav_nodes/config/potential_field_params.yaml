potential_field_node:
  ros__parameters:
    # Goal position (can be overridden by /goal_pose topic)
    goal_x: 3.0 #4.0
    goal_y: 2.35 #0.6

    # Force gains
    k_attractive: 2.0
    k_repulsive: 1.0 #0.3

    # Ranges
    repulsive_range: 0.35 # Obstacle influence range (m)
    obstacle_threshold: 0.3 # Start slowing down distance (m)
    goal_tolerance: 0.01 # Goal reached distance (m)

    # Velocity limits
    max_linear_speed: 0.2 # TurtleBot3 max
    min_linear_speed: 0.001
    max_angular_speed: 1.55 # TurtleBot3 max 2.0

    # Local minima escape parameters
    stuck_threshold: 0.15 # If moved less than 15cm in 3 seconds = stuck
    escape_duration: 27.0 # Escape for 2 seconds
    escape_cooldown: 25.0 # Wait 3 seconds before allowing another escape
